[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --headed
    --browser=chromium
    --slowmo=500
    --html=test_report.html
    --self-contained-html
markers =
    smoke: Quick smoke tests
    regression: Full regression suite
    admin: Admin functionality tests
    client: Client functionality tests
