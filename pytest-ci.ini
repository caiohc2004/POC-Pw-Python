[pytest]
; CI variant of pytest.ini: runs headless with no slowmo (pytest.ini forces --headed for local debugging).
asyncio_mode = auto
testpaths = tests
    MyPlaywrightProject/Test Cases
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --browser=chromium
    --html=test_report.html
    --self-contained-html
markers =
    smoke: Quick smoke tests
    regression: Full regression suite
    admin: Admin functionality tests
    client: Client functionality tests
